<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
       <div class="sidebarContainer">
        <div class="sidebarIcons">
          <img src="dashboard-images/view-dashboard.svg" alt="dashboard icon" width="50" height="50">
          <img src="dashboard-images/home-circle.svg" alt="home icon" width="25" height="25">
          <img src="dashboard-images/account-box-outline.svg" alt="account icon" width="25" height="25">
          <img src="dashboard-images/message-reply.svg" alt="message icon" width="25" height="25">
          <img src="dashboard-images/history.svg" alt="history icon" width="25" height="25">
          <img src="dashboard-images/text-box-multiple-outline.svg" alt="task icon" width="25" height="25">
          <img src="dashboard-images/account-group.svg" alt="communities icon" width="25" height="25">
          <img src="dashboard-images/cog.svg" alt="settings icon" width="25" height="25">
          <img src="dashboard-images/help-box.svg" alt="help icon" width="25" height="25">
          <img src="dashboard-images/shield-check.svg" alt="privacy icon" width="25" height="25">
        </div>
        <div class="sidebarText">
          <p class="dashboardText">dashboard</p>
          <p class="homeText">Home</p>
          <p class="profileText">Profile</p>
          <p>Messages</p>
          <p>History</p>
          <p>Tasks</p>
          <p>Communities</p>
          <p class="settingsText">Settings</p>
          <p class="supportText">Support</p>
          <p class="privacyText">Privacy</p>
        </div>
       </div>   
    </div>
    <div class="header">
     <div class="headerTop">
      <img class="magIcon" src="dashboard-images/magnify.svg" alt="magnify icon" width="25" height="25">
        <label for="search"> </label>
        <input class="searchBar"
        type="text"
        id="search"
        name="search" />
      <img class="bellIcon" src="dashboard-images/bell-ring.svg" alt="bell icon" width="25" height="25">
      <img class="catOne" src="dashboard-images/cat-icon.png" alt="cat icon" width="40" height="40">
      <p class="nameOne">Someone Somebody</p>   
     </div>
     <div class="headerBottom">
      <img class="catTwo" src="dashboard-images/cat-icon.png" alt="cat icon" width="80" height="80">
      <div class="bottomHeadText">
       <p class="hiText">Hi there,</p>
       <p class="nameTwo">Someone Somebody (@someone)</p>
      </div>
      <button>New</button>
      <button>Upload</button>
      <button>Share</button> 
     </div> 
    </div>
    <div class="mainContent">
    
    </div>





  </div>
</body>
</html>
